<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="70%" stop-color="#050c1a"/>
      <stop offset="100%" stop-color="#02060d"/>
    </radialGradient>
    
    <!-- Gold Yellow Text Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3A1"/>
      <stop offset="35%" stop-color="#FFC700"/>
      <stop offset="70%" stop-color="#E68A00"/>
      <stop offset="100%" stop-color="#B35900"/>
    </linearGradient>

    <!-- Metallic Silver/White Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Signal Arc Gradient -->
    <linearGradient id="signalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD000"/>
      <stop offset="50%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Circle Background -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGrad)" stroke="#FFB700" stroke-width="4"/>

  <!-- Top Signal Waves (Wifi) -->
  <g fill="none" stroke="url(#signalGrad)" stroke-linecap="round">
    <path d="M 176 130 A 110 110 0 0 1 336 130" stroke-width="20"/>
    <path d="M 200 165 A 75 75 0 0 1 312 165" stroke-width="18"/>
    <path d="M 224 198 A 40 40 0 0 1 288 198" stroke-width="16"/>
    <circle cx="256" cy="222" r="12" fill="#DC2626" stroke="none"/>
  </g>

  <!-- Left Bar Chart -->
  <g fill="url(#goldGrad)">
    <rect x="90" y="160" width="16" height="25" rx="3"/>
    <rect x="114" y="140" width="16" height="45" rx="3"/>
    <rect x="138" y="115" width="16" height="70" rx="3"/>
  </g>

  <!-- Right Orbiting Planet -->
  <g transform="translate(370, 140)">
    <circle cx="0" cy="0" r="22" fill="#EA580C"/>
    <ellipse cx="0" cy="0" rx="42" ry="12" fill="none" stroke="#FFFFFF" stroke-width="5" transform="rotate(-25)"/>
  </g>

  <!-- Bottom Circuit Lines -->
  <path d="M 96 370 L 160 370 L 190 395 L 300 395" stroke="#FFB700" stroke-width="4" fill="none" opacity="0.8"/>
  <circle cx="96" cy="370" r="5" fill="#FFC700"/>
  <circle cx="300" cy="395" r="5" fill="#FFC700"/>
  
  <path d="M 120 390 L 175 390 L 210 420 L 290 420" stroke="#FF8800" stroke-width="4" fill="none" opacity="0.8"/>
  <circle cx="120" cy="390" r="5" fill="#FF8800"/>
  <circle cx="290" cy="420" r="5" fill="#FF8800"/>

  <!-- Globe (Bottom Right) -->
  <g transform="translate(370, 370)">
    <circle cx="0" cy="0" r="50" fill="#0284C7"/>
    <!-- Continents -->
    <path d="M -25 -10 Q -10 -35 15 -30 Q 30 -10 10 15 Q -15 35 -30 20 Z" fill="#22C55E"/>
    <path d="M 5 20 Q 25 10 35 30 Q 15 45 -5 40 Z" fill="#22C55E"/>
    <!-- Grid Lines -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="50" ry="20" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="20" ry="50" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Main Banner Arc behind text -->
  <path d="M 60 220 Q 256 185 452 220 Q 430 330 256 345 Q 82 330 60 220 Z" fill="#030A16" stroke="#FF9900" stroke-width="3"/>

  <!-- "DONMAC" Text -->
  <text x="256" y="280" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="76" font-style="italic" fill="url(#goldGrad)" stroke="#000000" stroke-width="3" letter-spacing="-1">DONMAC</text>

  <!-- "- DATA HUB -" Subtext -->
  <text x="256" y="318" text-anchor="middle" font-family="'Arial', sans-serif" font-weight="900" font-size="28" fill="url(#silverGrad)" letter-spacing="4">— DATA HUB —</text>
</svg>
